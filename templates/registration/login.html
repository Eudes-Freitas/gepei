{% extends "base.html" %}
{% block title %}Acesso | GEPEI{% endblock %}
{% block content %}
  <section class="login-card">
    <p class="eyebrow">Gestor de Plano Estratégico Institucional</p>
    <h1>Acessar GEPEI</h1>
    <p>Use seu nome ou e-mail cadastrado para acompanhar planos, ações e riscos.</p>
    <form method="post">{% csrf_token %}{{ form.as_p }}<button class="primary" type="submit">Entrar</button></form>
  </section>
  <script>
    (function () {
      var input = document.querySelector('.login-card input[type="password"]');
      if (!input) { return; }
      var wrap = document.createElement('span');
      wrap.className = 'password-field';
      input.parentNode.insertBefore(wrap, input);
      wrap.appendChild(input);
      var eye = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
      var eyeOff = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a19.8 19.8 0 0 1 5.1-5.9M9.9 4.2A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a19.7 19.7 0 0 1-3.2 4.2"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M1 1l22 22"/></svg>';
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'password-toggle';
      button.innerHTML = eye;
      button.setAttribute('aria-label', 'Mostrar senha');
      button.setAttribute('aria-pressed', 'false');
      button.addEventListener('click', function () {
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        button.innerHTML = show ? eyeOff : eye;
        button.setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha');
        button.setAttribute('aria-pressed', show ? 'true' : 'false');
        input.focus();
      });
      wrap.appendChild(button);
    }());
  </script>
{% endblock %}
