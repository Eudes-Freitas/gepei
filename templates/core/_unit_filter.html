<form method="get" class="dashboard-filters" aria-label="Filtro por setor"><label>Setor<select name="unit"><option value="">Todos os setores disponíveis</option>{% for unit in units %}<option value="{{ unit.id }}" {% if selected_unit == unit.id|stringformat:"s" %}selected{% endif %}>{{ unit.acronym|default:unit.name }}</option>{% endfor %}</select></label><button class="button button-primary" type="submit">Aplicar filtro</button></form>
