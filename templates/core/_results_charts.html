
  {% load static %}
  {% if can_view_measurements or inline_charts or focused_charts or progress_chart %}
  <script src="{% static 'vendor/highcharts.js' %}"></script>
  <script>
    (function () {
      Highcharts.setOptions({ lang: { decimalPoint: ',', thousandsSep: '.' } });
      var font = { fontFamily: 'Inter, Arial, sans-serif' };
      document.querySelectorAll('[id^="target-indicator-chart-"]').forEach(function (box) {
        var source = document.getElementById(box.id.replace('target-indicator-chart-', 'target-chart-data-'));
        if (!source) { box.outerHTML = '<div class="empty-state"><strong>Sem dados para o gráfico.</strong><span>Registre aferições com resultado numérico para acompanhar a evolução.</span></div>'; return; }
        var data = JSON.parse(source.textContent);
        var series = [{
          name: 'Resultado aferido',
          data: data.result.map(function (point, index) {
            var item = { y: point.y, custom: { tip: point.tip, description: point.description, responsible: point.responsible } };
            var expected = data.expected[index];
            item.dataLabels = { y: expected !== null && point.y < expected ? 26 : -18 };
            if (point.baseline) { item.marker = { symbol: 'diamond', radius: 7, fillColor: '#ffffff', lineColor: '#0b7285', lineWidth: 3 }; }
            return item;
          })
        }];
        if (data.has_expected) { series.push({ name: 'Meta do período', data: data.expected.map(function (value, index) { var result = data.result[index] ? data.result[index].y : null; return { y: value, dataLabels: { y: result !== null && value !== null && result < value ? -18 : 26 } }; }), dashStyle: 'ShortDash', color: '#6b7280', dataLabels: { enabled: true, style: { color: '#172b3a', textOutline: 'none' }, formatter: function () { return this.y === null ? '' : Highcharts.numberFormat(this.y, -1); } } }); }
        Highcharts.chart(box, {
          chart: { type: 'line', height: 300, style: font },
          title: { text: null }, credits: { enabled: false },
          legend: { enabled: series.length > 1 },
          xAxis: { categories: data.categories, title: { text: 'Fim do período de aferição' } },
          yAxis: { title: { text: 'Valor' } },
          tooltip: { shared: true, formatter: function () {
            var lines = [];
            var point = this.points[0] ? this.points[0].point : null;
            var header = '<b>' + this.x + '</b>';
            if (point && point.custom) {
              header += point.custom.responsible ? ' - ' + point.custom.responsible : '';
              lines.push(header);
              if (point.custom.description) { lines.push(point.custom.description); }
            } else {
              lines.push(header);
            }
            this.points.forEach(function (item) {
              if (item.series.name === 'Meta do período') {
                lines.push('<b style=\"color:#172b3a\">Meta do período: ' + Highcharts.numberFormat(item.y, -1) + '</b>');
              } else {
                lines.push('<span style=\"color:#1769aa\">' + item.series.name + '</span>: <b style=\"color:#1769aa\">' + Highcharts.numberFormat(item.y, -1) + '</b>');
              }
            });
            return lines.join('<br/>');
          } },
          plotOptions: { line: { dataLabels: { enabled: true, style: { color: '#1769aa', textOutline: 'none' } } } },
          series: series
        });
      });
      document.querySelectorAll('[data-achievement-source]').forEach(function (box) {
        var data = JSON.parse(document.getElementById(box.dataset.achievementSource).textContent);
        var current = Number(box.dataset.currentIndicator);
        var withoutMeasurement = data.total === null;
        Highcharts.chart(box, {
          chart: { type: 'pie', height: 340, style: font },
          title: { text: withoutMeasurement ? '0' : Highcharts.numberFormat(data.total, 1) + '%', align: 'center', verticalAlign: 'middle', x: 0, y: 25, style: { fontSize: '24px' } },
          credits: { enabled: false }, legend: { enabled: false },
          tooltip: { formatter: function () {
            var point = this.point;
            if (point.achievement === null) {
              return point.name + ': <b>' + Highcharts.numberFormat(point.y, 1) + '%</b>';
            }
            return 'Atingimento do indicador: <b>' + Highcharts.numberFormat(point.achievement, 1) + '%</b>';
          } },
          plotOptions: { pie: { center: ['50%', '50%'], innerSize: '58%', showInLegend: true, borderWidth: 2, dataLabels: { enabled: !withoutMeasurement, distance: 14, formatter: function () { return this.point.name; } } } },
          series: [{ name: 'Composição da meta', data: data.pie_points.map(function (point) { return Object.assign({}, point, { borderColor: '#ffffff', borderWidth: 2 }); }) }]
        });
      });
      document.querySelectorAll('[data-current-result-source]').forEach(function (box) {
        var data = JSON.parse(document.getElementById(box.dataset.currentResultSource).textContent);
        var achievement = box.querySelector('[data-result-achievement]');
        if (data.achievement === null) { achievement.textContent = 'Sem dados suficientes para calcular o atingimento.'; return; }
        Highcharts.chart(achievement, {
          chart: { type: 'bar', height: 170, style: font }, title: { style: { fontSize: '16px' }, text: 'Atingimento: ' + Highcharts.numberFormat(data.achievement, 1) + '%' },
          credits: { enabled: false }, legend: { enabled: false }, xAxis: { categories: ['Atingimento'] },
          yAxis: { min: Math.min(0, data.achievement), max: Math.max(100, data.achievement * 1.1), title: { text: 'Atingimento (%)' }, plotLines: [{ value: 100, color: '#16834a', width: 2, dashStyle: 'ShortDash', label: { text: 'Meta: 100%' } }] },
          tooltip: { valueSuffix: '%' },
          plotOptions: { bar: { dataLabels: { enabled: true, format: '{y:.1f}%' }, borderRadius: 4 } },
          series: [{ name: 'Atingimento', data: [{ y: data.achievement, color: data.achievement >= 100 ? '#16834a' : '#e5a11b' }] }]
        });
      });
      var progress = document.getElementById('target-progress-data');
      if (progress) {
        var data = JSON.parse(progress.textContent);
        Highcharts.chart('target-progress-chart', {
          chart: { type: 'bar', height: Math.max(220, data.categories.length * 34 + 80), style: font },
          title: { text: null }, credits: { enabled: false }, legend: { enabled: false },
          xAxis: { categories: data.categories, title: { text: null } },
          yAxis: { min: 0, max: 100, title: { text: 'Progresso até a meta final (%)' }, gridLineColor: '#e8edf5' },
          tooltip: { formatter: function () {
            var i = this.point.index;
            return '<b>' + this.x + '</b><br/>' + data.descriptions[i] + '<br/>Progresso: <b>' + Highcharts.numberFormat(data.raw[i], 1) + '%</b><br/>Situação: ' + data.labels[i];
          } },
          plotOptions: { bar: { borderRadius: 4, pointPadding: 0.1, groupPadding: 0.08, dataLabels: { enabled: true, format: '{y:.1f}%' } } },
          series: [{ name: 'Progresso', data: data.values.map(function (value, i) { return { y: value, color: data.colors[i] }; }) }]
        });
      }
    }());
  </script>
  {% endif %}

<script>
(function () {
  function toggleFacts(section) {
    var content=section.querySelector('[data-facts-content]');
    var button=section.querySelector('[data-toggle-facts]');
    var expanded=button.getAttribute('aria-expanded')==='true';
    content.hidden=expanded;
    section.querySelectorAll('[data-toggle-facts]').forEach(function(item){item.setAttribute('aria-expanded',String(!expanded));item.textContent=expanded?'+ Expandir':'− Recolher';});
    var heading=section.querySelector('[data-toggle-facts-header]');if(heading){heading.setAttribute('aria-expanded',String(!expanded));}
  }
  document.querySelectorAll('[data-toggle-facts-header]').forEach(function(heading){
    heading.addEventListener('click',function(event){if(event.target.closest('button,a')){return;}toggleFacts(heading.closest('[data-collapsible-facts]'));});
    heading.addEventListener('keydown',function(event){if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleFacts(heading.closest('[data-collapsible-facts]'));}});
  });
  document.querySelectorAll('[data-toggle-facts]').forEach(function (button) {
    button.addEventListener('click', function () {
      toggleFacts(button.closest('[data-collapsible-facts]'));
    });
  });
}());
</script>
