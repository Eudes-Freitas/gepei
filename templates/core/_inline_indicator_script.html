<script>
(function () {
  document.querySelectorAll('[data-inline-indicator-form]').forEach(function (form) {
    var section = form.closest('[data-collapsible-facts]');
    var facts = section.querySelector('[data-facts-content]');
    var toggle = section.querySelector('[data-toggle-facts], [data-toggle-definition]');
    var edit = section.querySelector('[data-edit-indicator]');
    function editing(value) {
      form.hidden = !value;
      facts.hidden = value;
      toggle.hidden = value;
      edit.hidden = value;
      if (!value) { toggle.setAttribute('aria-expanded', 'true'); toggle.textContent = 'Recolher'; }
    }
    edit.addEventListener('click', function () { editing(true); form.querySelector('select,input:not([type="hidden"]),textarea').focus(); });
    form.querySelector('[data-cancel-indicator]').addEventListener('click', function () { form.reset(); editing(false); edit.focus(); });
    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      var save = form.querySelector('[type="submit"]');
      var error = form.querySelector('[data-inline-error]');
      save.disabled = true;
      error.hidden = true;
      try {
        var response = await fetch(form.action, {method:'POST', body:new FormData(form), headers:{'Accept':'application/json'}});
        if (!response.ok) {
          var data = await response.json();
          throw new Error(data.errors ? Object.values(data.errors).flat().join(' ') : 'Não foi possível salvar a ficha.');
        }
        location.hash = section.closest('[id]').id;
        location.reload();
      } catch (failure) {
        error.textContent = failure.message || 'Não foi possível salvar. Tente novamente.';
        error.hidden = false;
        save.disabled = false;
      }
    });
  });
}());
</script>
